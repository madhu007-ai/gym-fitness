{% extends "base.html" %}
{% block title %}Edit Skill - GymFitness{% endblock %}

{% block content %}
<div class="form-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light mb-3">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <div class="form-card">
                    <div class="form-card-header">
                        <i class="bi bi-star display-6 text-warning mb-2"></i>
                        <h3>Edit Skill</h3>
                    </div>
                    <div class="form-card-body">
                        <form action="{{ url_for('edit_skill', skill_id=skill.id) }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Skill Name *</label>
                                <input type="text" class="form-control gym-input" name="name"
                                       value="{{ skill.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select gym-input" name="category">
                                    {% for cat in ['Strength Training','Cardio','Yoga & Flexibility','Nutrition','Sports Coaching','Rehabilitation','Other'] %}
                                    <option {% if skill.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Proficiency: <span id="val">{{ skill.proficiency }}</span>%</label>
                                <input type="range" class="form-range" name="proficiency"
                                       min="0" max="100" value="{{ skill.proficiency }}"
                                       oninput="document.getElementById('val').textContent=this.value">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Icon Class</label>
                                <input type="text" class="form-control gym-input" name="icon"
                                       value="{{ skill.icon or 'bi-star' }}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea class="form-control gym-input" name="description" rows="3">{{ skill.description or '' }}</textarea>
                            </div>
                            <div class="d-flex gap-3 justify-content-end">
                                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-gym-primary">
                                    <i class="bi bi-save me-1"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
