{% extends "base.html" %}
{% block title %}Update Profile - GymFitness{% endblock %}

{% block content %}
<div class="form-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light mb-3">
                    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
                </a>
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="profile-avatar-preview mb-3">
                            <i class="bi bi-person-circle display-3 text-primary"></i>
                        </div>
                        <h3>Update Profile</h3>
                        <p class="text-muted">Keep your information up to date</p>
                    </div>
                    <div class="form-card-body">
                        <form action="{{ url_for('update_profile') }}" method="POST" novalidate>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username (cannot change)</label>
                                <input type="text" class="form-control gym-input" value="{{ user.username }}" disabled>
                                <div class="form-text">Username cannot be changed after registration.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <div class="input-group gym-input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control gym-input" name="full_name"
                                           value="{{ user.full_name or '' }}" placeholder="Your full name">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group gym-input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control gym-input" name="email"
                                           value="{{ user.email }}" required>
                                </div>
                            </div>
                            
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Fitness Goal</label>
                                <div class="input-group gym-input-group">
                                    <span class="input-group-text"><i class="bi bi-bullseye"></i></span>
                                    <select class="form-select gym-input" name="goal">
                                        <option value="">Select your goal...</option>
                                        {% for goal in ['Lose Weight', 'Build Muscle', 'Improve Endurance', 'Increase Flexibility', 'Sports Performance', 'General Fitness', 'Stress Relief'] %}
                                        <option {% if user.goal == goal %}selected{% endif %}>{{ goal }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Bio / About Me</label>
                                <textarea class="form-control gym-input" name="bio" rows="4"
                                          placeholder="Tell others about yourself, your fitness journey, experience...">{{ user.bio or '' }}</textarea>
                            </div>
                            
                            <div class="d-flex gap-3 justify-content-end">
                                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-gym-primary btn-lg px-5">
                                    <i class="bi bi-save me-2"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
