{% extends "base.html" %}
{% block title %}Page Not Found - GymFitness{% endblock %}

{% block content %}
<div class="error-page text-center py-6">
    <div class="container">
        <div class="error-number">404</div>
        <h2 class="text-accent">Oops! Page Not Found</h2>
        <p class="text-muted lead">Looks like this page skipped leg day — it's not here!</p>
        <div class="mt-4 d-flex justify-content-center gap-3">
            <a href="{{ url_for('home') }}" class="btn btn-gym-primary btn-lg">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-lg">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
