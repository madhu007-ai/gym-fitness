{% extends "base.html" %}
{% block title %}Edit Equipment - GymFitness{% endblock %}

{% block content %}
<div class="form-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light mb-3">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <div class="form-card">
                    <div class="form-card-header">
                        <i class="bi bi-tools display-6 text-info mb-2"></i>
                        <h3>Edit Equipment</h3>
                    </div>
                    <div class="form-card-body">
                        <form action="{{ url_for('edit_technology', tech_id=tech.id) }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Equipment Name *</label>
                                <input type="text" class="form-control gym-input" name="name"
                                       value="{{ tech.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select gym-input" name="category">
                                    {% for cat in ['Cardio Machines','Free Weights','Strength Machines','Functional Training','Recovery','Accessories'] %}
                                    <option {% if tech.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Quantity</label>
                                    <input type="number" class="form-control gym-input" name="quantity"
                                           value="{{ tech.quantity }}" min="1">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Condition</label>
                                    <select class="form-select gym-input" name="condition">
                                        {% for cond in ['Excellent','Good','Fair','Needs Maintenance'] %}
                                        <option {% if tech.condition == cond %}selected{% endif %}>{{ cond }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Icon Class</label>
                                <input type="text" class="form-control gym-input" name="icon"
                                       value="{{ tech.icon or 'bi-tools' }}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea class="form-control gym-input" name="description" rows="3">{{ tech.description or '' }}</textarea>
                            </div>
                            <div class="d-flex gap-3 justify-content-end">
                                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-gym-primary">
                                    <i class="bi bi-save me-1"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
